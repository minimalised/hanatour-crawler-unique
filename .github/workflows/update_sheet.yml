name: Sync Hotel Data to Sheet

on:
  schedule:
    # 매일 한국 시간 기준 오전 6시 실행 (UTC 21시)
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 활성화

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Run Script
      env:
        GOOGLE_JSON_RAW: ${{ secrets.GOOGLE_JSON_RAW }}
        SPREADSHEET_ID: ${{ secrets.SOURCE_SPREADSHEET_ID }}
      run: python update_sheet.py
