name: Daily Hanatour Crawling (Batch v2)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 한국 시간 오전 6시 자동 실행
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gspread google-auth playwright playwright-stealth openai
          python -m playwright install-deps
      - name: Run Hanatour New Crawler v2
        env:
          GOOGLE_JSON_RAW: ${{ secrets.GOOGLE_JSON_RAW }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_SPREADSHEET_ID: ${{ secrets.SOURCE_SPREADSHEET_ID }}
          TARGET_SPREADSHEET_ID: ${{ secrets.TARGET_SPREADSHEET_ID }}
        run: |
          python -u crawling2.py
